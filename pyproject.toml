[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "editor-core-python"
version = "0.1.0"
description = "Python bindings and a small authoring facade for the editor-core MLT++ library"
requires-python = ">=3.10"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["python/editor_core"]
sdist.include = ["CMakeLists.txt", "cmake/**", "src/**", "python/**", "tests/**", "examples/**", "README.md"]
